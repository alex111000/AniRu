name: Build AniRu TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
      - aniru

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Test AnimeVost long playlists
        run: |
          ./gradlew :animevost-sdk:testDebugUnitTest \
            --no-daemon \
            --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8" \
            -Dkotlin.daemon.jvm.options="-Xmx1024m" \
            --stacktrace

      - name: Test AniRu provider engine
        run: |
          ./gradlew :app-tv:testAppDebugUnitTest \
            --no-daemon \
            --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8" \
            -Dkotlin.daemon.jvm.options="-Xmx1024m" \
            --stacktrace

      - name: Lint AniRu TV
        run: |
          ./gradlew :app-tv:lintAppDebug \
            --no-daemon \
            --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8" \
            -Dkotlin.daemon.jvm.options="-Xmx1024m" \
            --stacktrace

      - name: Build AniRu TV debug APK
        run: |
          ./gradlew :app-tv:assembleAppDebug \
            --no-daemon \
            --max-workers=1 \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8" \
            -Dkotlin.daemon.jvm.options="-Xmx1024m" \
            --stacktrace

      - name: Upload AniRu APK
        uses: actions/upload-artifact@v6
        with:
          name: AniRu-TV-v1.2.7-debug
          path: app-tv/build/outputs/apk/app/debug/*.apk
          if-no-files-found: error

      - name: Upload verification reports on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: AniRu-v1.2.7-verification-reports
          path: |
            animevost-sdk/build/reports/tests/
            app-tv/build/reports/tests/
            app-tv/build/reports/lint-results-appDebug.html
            app-tv/build/intermediates/lint_intermediate_text_report/
          if-no-files-found: ignore
